<style>
:root{--sb:env(safe-area-inset-bottom,0px)}
#bell{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 150px);z-index:30;display:flex;align-items:center;gap:10px;background:#1D2A47;color:#fff;border-radius:16px;padding:12px 12px 12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px);cursor:pointer}
#bell[hidden]{display:none}
#bell b{display:block;font-size:15px}

#bellX{border:0;background:transparent;color:#B4BED3;font-size:18px;padding:4px 6px;cursor:pointer}
:root{
--bg:#EDF0F5; --card:#FFFFFF; --ink:#131A27; --sub:#5F697B; --line:#E2E6ED; --soft:#EEF1F6;
--accent:#1D2A47; --accent-soft:#E3E8F3; --on-accent:#FFFFFF;
--hero:#1D2A47; --hero-ink:#FFFFFF; --hero-sub:#B4BED3; --hero-track:#33415F; --gold:#FFB938;

--c1:#FF7A59; --c2:#3E7BFA; --c3:#1FAE7A; --c4:#F2AE00; --c5:#8E66F0; --c6:#F0559A; --c7:#15AFC4; --c8:#8A94A6;
--shadow:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){
:root{ --bg:#0C0F16; --card:#161B26; --ink:#EEF1F6; --sub:#98A2B3; --line:#252C3A; --soft:#1D2330;
--accent:#9DB2FF; --accent-soft:#1E2741; --on-accent:#0C0F16;
--hero:#1F2D52; --hero-ink:#FFFFFF; --hero-sub:#A9B5D0; --hero-track:#2F3E66; --gold:#FFC453;
--warn:#FF9D4D; --warn-soft:#38240F; --bad:#FF7B70; --bad-soft:#3A1B19; --good:#4CD69A;
--c1:#FF8B6E; --c2:#6E9BFF; --c3:#3FCB95; --c4:#FFC433; --c5:#A889FF; --c6:#FF77B0; --c7:#3ACBDD; --c8:#9AA3B5;
--shadow:none; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;overflow-x:hidden}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.45;letter-spacing:-.01em}
body{padding-bottom:calc(84px + var(--sb,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 6px}
.topbar{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand-ic{width:40px;height:40px;border-radius:12px;background:var(--hero);display:grid;place-items:center;flex:none}
.brand-ic svg{width:23px;height:23px}
.month{display:flex;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--sub)}
.month button,.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--sub)}
.month button:active,.icon-btn:active{background:var(--soft)}
main{padding:0 16px;max-width:560px;margin:0 auto}
section[data-view]{display:none}
section[data-view].on{display:block}
.card{background:var(--card);border-radius:18px;padding:18px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:14px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.daily{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px}
.daily b{font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;gap:10px}
.row .k{color:var(--sub)} .row .v{font-weight:600;white-space:nowrap}
.item .v{white-space:nowrap}
.row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.row.total .v{font-size:18px}
.hbar{margin:8px 0}

.hbar .bar{height:8px}
.list-group{margin-bottom:14px}
.list-date{font-size:13px;color:var(--sub);font-weight:600;margin:16px 4px 6px;display:flex;justify-content:space-between}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);cursor:pointer}
.list-group .tx:first-of-type{border-radius:14px 14px 0 0}
.list-group .tx:last-child{border-radius:0 0 14px 14px}

.tx + .tx{border-top:1px solid var(--line)}
.tx .ic,.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.tx .mid{flex:1;min-width:0}

.tx .s{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap}
.tx .amt.refund{color:var(--good)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(4px + var(--sb,0px))}

nav.tabbar svg{width:22px;height:22px}
nav.tabbar button.on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + var(--sb,0px));z-index:7;height:54px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(20,35,70,.25);cursor:pointer}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.96)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;padding:10px 18px calc(22px + var(--sb,0px));transform:translateY(105%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet{overscroll-behavior:contain;overflow-x:hidden;touch-action:pan-y}
.sheet .two > *{min-width:0}
.sheet input,.sheet select,.sheet textarea{min-width:0;max-width:100%}
.sheet input[type=date],.sheet input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:48px;display:block}
.sheet.dragging{transition:none}
.grab-zone{margin:-10px -18px 0;padding:10px 18px 14px;touch-action:none;cursor:grab}
body.sheet-open{position:fixed;left:0;right:0;overflow:hidden}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;margin:4px 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:12.5px;color:var(--sub);margin-top:5px}
.field.amount input{font-size:26px;font-weight:700;padding:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{width:auto;padding:8px 14px;font-size:13.5px;border-radius:10px}
.btns{display:grid;gap:8px;margin-top:6px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:4px 0 14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:12px}
.toggle-row .d{font-size:12.5px;color:var(--sub)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i:before{transform:translateX(20px)}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;gap:10px;cursor:pointer}
.item + .item{border-top:1px solid var(--line)}
.item .t{font-weight:600} .item .s{font-size:12.5px;color:var(--sub)}
.item.off{opacity:.45}
.add-link{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;padding:4px}
.grp-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--sub);padding:12px 0 4px;border-bottom:1px solid var(--line)}
.fx{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}.fx .d{width:30px;color:var(--sub);font-size:13px;flex:none}.fx .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fx.off{opacity:.45}
.loan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.loan-grid div{background:var(--soft);border-radius:12px;padding:10px 12px}
.loan-grid .k{font-size:12px;color:var(--sub)} .loan-grid .v{font-weight:700;font-size:16px}
.note{font-size:13px;color:var(--sub);background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.note b{color:var(--warn)}
.copy{display:flex;gap:8px;align-items:center}
.copy code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--soft);padding:10px 12px;border-radius:10px;font-size:13px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-200%);z-index:40;opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);width:max-content;transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:pre-line}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast.warn{background:var(--warn);color:#fff} .toast.bad{background:var(--bad);color:#fff}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
#lock.on{display:flex}
#lock h1{font-size:28px;margin:0 0 6px;letter-spacing:-.03em}
#lock .logo{width:56px;height:56px;border-radius:18px;background:var(--hero);display:grid;place-items:center;margin-bottom:18px}
#lock .logo svg{width:30px;height:30px}
#lock p{color:var(--sub);margin:0 0 22px}
#lock .pinwrap{display:flex;flex-direction:column;align-items:center;text-align:center}
#lock .pinwrap p{margin:0}
.dots{display:flex;gap:16px;margin:22px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.dots.shake{animation:shake .35s}

#lock .pin-err{color:var(--bad);min-height:22px;margin:0 0 6px;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 24px;justify-content:center;margin-top:6px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--card);font-size:26px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.pad button:active{background:var(--soft)}
.who-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;text-align:left;cursor:pointer;font-size:16px}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--bg);color:var(--sub);transition:opacity .2s}
.loading.off{opacity:0;pointer-events:none}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{opacity:.6;pointer-events:none}
svg.spark{width:100%;height:54px;display:block;margin-top:6px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;margin:0 0 12px}
.hero .label{color:var(--hero-sub);font-size:13.5px}

.hero .sub2{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hchip{background:var(--hero-track);border-radius:12px;padding:9px 12px;font-size:13px;flex:1 1 130px;min-width:0}
.hchip small{display:block;color:var(--hero-sub);font-size:11.5px;margin-bottom:1px}
.hchip b{font-size:15px}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;line-height:1.05}
.ring .pct small{display:block;font-weight:500;font-size:11px;color:var(--hero-sub)}
.alertbox{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);margin-bottom:12px}
.alertbox.bad{background:var(--bad-soft);color:var(--bad)}
.alertbox b{display:block;font-size:15px;margin-bottom:2px}
.alertbox span{font-size:13.5px;color:var(--ink);opacity:.85}
.alertbox svg{flex:none;width:22px;height:22px;margin-top:1px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px;margin:4px 0 12px}
.stack i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:8px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 10px}
.split i{display:block;height:100%}
.split-legend{display:flex;justify-content:space-between;gap:10px;font-size:14px}

.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}

.mcard::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.mcard .n{font-weight:700;font-size:14px;position:relative}
.mcard .o{font-size:12px;opacity:.8}
.mcard .a{font-weight:800;font-size:20px;letter-spacing:-.02em;position:relative}
.mcard .p{font-size:11.5px;opacity:.85;position:relative}
.cat-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.cat-row .mid{flex:1;min-width:0}
.cat-row .bar{height:5px;margin-top:5px}
.up-row{display:flex;align-items:center;gap:12px;padding:8px 0}

.dt-mer{font-size:16px;font-weight:600;color:var(--sub)}
.dt-amt{font-size:30px;font-weight:800;letter-spacing:-.03em}

.mcard{cursor:pointer}

</style>

<body>
<div id="pk" hidden></div>
<div id="bell" hidden><span style="font-size:22px">🔔</span><span><b>폰 알림 켜기</b><small>예산 경고를 배너·진동으로 받아요</small></span><button id="bellX" aria-label="닫기">✕</button></div>
<div id="lock">
<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#FFB938" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg></div>
<h1>융림이네 가계부</h1>
<p>처음 한 번만 비밀키를 입력하면 이 기기에 저장돼요.<br><small>아이폰은 Safari에서 아래 공유 버튼 → ‘홈 화면에 추가’를 한 뒤, 홈 화면 아이콘으로 열어서 입력하세요.</small></p>
<div class="field"><label>비밀키</label><input id="keyInput" autocomplete="off" autocapitalize="off" placeholder="setup 실행 때 나온 비밀키"></div>
<button class="btn" id="keyBtn">시작하기</button>
<p id="keyErr" style="color:var(--bad);margin-top:12px"></p>
</div>
